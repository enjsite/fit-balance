<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Admin Statistics Main</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>

</head>

<body class="bg-light">

<div class="container">
    <div class="row">
        <div class="col">
            <h1>Fit Balance</h1>

            <h3>Общая статистика приложения</h3>

            <br/>
            <p>Пользователей: <span th:text="${userCount}"></span></p>
            <p>Тренировок всего: <span th:text="${workoutCount}"></span></p>
            <p>Последнее обновление данных: <span th:text="${actualDate}"></span></p>

        </div>
    </div>
</div>

</body>
</html>
