server.port=9090

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost/fitbalance}
spring.datasource.username=${SPRING_DATASOURCE_USER:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driverClassName=${SPRING_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

app-service.url=${APP_SERVICE_URL:http://localhost:8090}
